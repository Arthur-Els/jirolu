<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGong" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#0B0A09"/>
    </linearGradient>
    <radialGradient id="emasGong" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="25%" stop-color="#E2BE51"/>
      <stop offset="60%" stop-color="#9C7328"/>
      <stop offset="88%" stop-color="#553A0F"/>
      <stop offset="100%" stop-color="#241705"/>
    </radialGradient>
  </defs>

  <!-- Latar Gelap -->
  <rect width="800" height="600" fill="url(#bgGong)"/>

  <!-- Bingkai Tipis Emas -->
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="36" y="36" width="728" height="528" rx="12" fill="none" stroke="#A9783C" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Ornamen Sudut -->
  <path d="M 44 64 L 64 44" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 756 64 L 736 44" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 44 536 L 64 556" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 756 536 L 736 556" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Ikon Ilustrasi Gayor & Gong Ageng Bundar -->
  <g transform="translate(200, 100)">
    <!-- Tiang Gantungan Kayu Gayor -->
    <rect x="30" y="20" width="340" height="20" rx="4" fill="#362314" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5"/>
    <rect x="30" y="20" width="20" height="260" rx="4" fill="#291A0E"/>
    <rect x="350" y="20" width="20" height="260" rx="4" fill="#291A0E"/>
    
    <!-- Tali Penggantung -->
    <line x1="140" y1="40" x2="160" y2="90" stroke="#EFE6D2" stroke-width="3" stroke-opacity="0.7"/>
    <line x1="260" y1="40" x2="240" y2="90" stroke="#EFE6D2" stroke-width="3" stroke-opacity="0.7"/>

    <!-- Piringan Gong Ageng Bundar -->
    <circle cx="200" cy="170" r="100" fill="url(#emasGong)" stroke="#221605" stroke-width="4"/>
    <!-- Lingkaran Luar / Bibir Gong -->
    <circle cx="200" cy="170" r="85" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Pencu Tengah Gong (Tonjolan Pusat Suara) -->
    <circle cx="200" cy="170" r="28" fill="#FFF2CB" stroke="#7A5618" stroke-width="3"/>
  </g>

  <!-- Teks Informasi -->
  <text x="400" y="420" text-anchor="middle" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#EFE6D2" letter-spacing="2">
    GONG AGENG
  </text>
  <text x="400" y="455" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" letter-spacing="4">
    ꦒꦺꦴꦁꦲꦒꦼꦁ
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#EFE6D2" opacity="0.5" letter-spacing="1.5">
    FOTO SEGERA HADIR
  </text>
</svg>
