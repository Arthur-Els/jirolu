<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBonang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#0B0A09"/>
    </linearGradient>
    <radialGradient id="emasPencu" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#845D1C"/>
      <stop offset="100%" stop-color="#4B330B"/>
    </radialGradient>
  </defs>

  <!-- Latar Gelap -->
  <rect width="800" height="600" fill="url(#bgBonang)"/>

  <!-- Bingkai Tipis Emas -->
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="36" y="36" width="728" height="528" rx="12" fill="none" stroke="#A9783C" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Ornamen Sudut -->
  <path d="M 44 64 L 64 44" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 756 64 L 736 44" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 44 536 L 64 556" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 756 536 L 736 556" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Ikon Ilustrasi Pencon Bonang (Gong Kecil Berjajar 2 Baris) -->
  <g transform="translate(160, 140)">
    <!-- Rangka Kayu Rancakan -->
    <rect x="0" y="30" width="480" height="150" rx="12" fill="#24190F" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- Baris 1: 5 Gong Kecil -->
    <circle cx="60" cy="75" r="32" fill="url(#emasPencu)"/>
    <circle cx="60" cy="75" r="10" fill="#FFE29A"/>

    <circle cx="150" cy="75" r="32" fill="url(#emasPencu)"/>
    <circle cx="150" cy="75" r="10" fill="#FFE29A"/>

    <circle cx="240" cy="75" r="32" fill="url(#emasPencu)"/>
    <circle cx="240" cy="75" r="10" fill="#FFE29A"/>

    <circle cx="330" cy="75" r="32" fill="url(#emasPencu)"/>
    <circle cx="330" cy="75" r="10" fill="#FFE29A"/>

    <circle cx="420" cy="75" r="32" fill="url(#emasPencu)"/>
    <circle cx="420" cy="75" r="10" fill="#FFE29A"/>

    <!-- Baris 2: 5 Gong Kecil -->
    <circle cx="60" cy="140" r="32" fill="url(#emasPencu)"/>
    <circle cx="60" cy="140" r="10" fill="#FFE29A"/>

    <circle cx="150" cy="140" r="32" fill="url(#emasPencu)"/>
    <circle cx="150" cy="140" r="10" fill="#FFE29A"/>

    <circle cx="240" cy="140" r="32" fill="url(#emasPencu)"/>
    <circle cx="240" cy="140" r="10" fill="#FFE29A"/>

    <circle cx="330" cy="140" r="32" fill="url(#emasPencu)"/>
    <circle cx="330" cy="140" r="10" fill="#FFE29A"/>

    <circle cx="420" cy="140" r="32" fill="url(#emasPencu)"/>
    <circle cx="420" cy="140" r="10" fill="#FFE29A"/>
  </g>

  <!-- Teks Informasi -->
  <text x="400" y="420" text-anchor="middle" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#EFE6D2" letter-spacing="2">
    BONANG
  </text>
  <text x="400" y="455" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" letter-spacing="4">
    ꦧꦺꦴꦤꦁ
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#EFE6D2" opacity="0.5" letter-spacing="1.5">
    FOTO SEGERA HADIR
  </text>
</svg>
