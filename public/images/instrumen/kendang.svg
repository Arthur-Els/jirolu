<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKendang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#0B0A09"/>
    </linearGradient>
    <linearGradient id="kayuKendang" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A311D"/>
      <stop offset="50%" stop-color="#2B1A0E"/>
      <stop offset="100%" stop-color="#1A1009"/>
    </linearGradient>
    <linearGradient id="kulitTebokan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6CD"/>
      <stop offset="100%" stop-color="#C2AE8B"/>
    </linearGradient>
  </defs>

  <!-- Latar Gelap -->
  <rect width="800" height="600" fill="url(#bgKendang)"/>

  <!-- Bingkai Tipis Emas -->
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.35"/>
  <rect x="36" y="36" width="728" height="528" rx="12" fill="none" stroke="#A9783C" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Ornamen Sudut -->
  <path d="M 44 64 L 64 44" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 756 64 L 736 44" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 44 536 L 64 556" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M 756 536 L 736 556" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Ikon Ilustrasi Tabung Kendang Gamelan -->
  <g transform="translate(180, 110)">
    <!-- Penyangga Kayu Bawah (Kuda-kuda Plangkan) -->
    <path d="M 40 230 Q 220 200 400 230 L 420 260 Q 220 230 20 260 Z" fill="#24170E" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Badan Kayu Kendang Berbentuk Gentong Cembung -->
    <path d="M 60 70 Q 220 40 380 90 L 380 200 Q 220 250 60 220 Z" fill="url(#kayuKendang)" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Tebokan Kiri (Sisi Besar - Bem/Dah) -->
    <ellipse cx="60" cy="145" rx="30" ry="75" fill="url(#kulitTebokan)" stroke="#4A311D" stroke-width="4"/>
    <ellipse cx="60" cy="145" rx="14" ry="40" fill="#B39F7D" opacity="0.4"/>

    <!-- Tebokan Kanan (Sisi Kecil - Kempyang/Tak) -->
    <ellipse cx="380" cy="145" rx="20" ry="55" fill="url(#kulitTebokan)" stroke="#4A311D" stroke-width="4"/>

    <!-- Jalinan Tali Kulit Janget (Pola Silang Huruf V) -->
    <path d="M 70 80 L 375 110 M 70 110 L 375 145 M 70 145 L 375 175 M 70 180 L 375 145 M 70 210 L 375 175" stroke="#E5D6B8" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Teks Informasi -->
  <text x="400" y="420" text-anchor="middle" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#EFE6D2" letter-spacing="2">
    KENDANG
  </text>
  <text x="400" y="455" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" letter-spacing="4">
    ꦏꦼꦤ꧀ꦝꦁ
  </text>
  <text x="400" y="495" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#EFE6D2" opacity="0.5" letter-spacing="1.5">
    FOTO SEGERA HADIR
  </text>
</svg>
